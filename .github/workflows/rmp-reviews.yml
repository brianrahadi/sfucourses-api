name: Refresh RMP reviews

on:
  schedule:
    # Mondays 11:17 UTC (04:17 Vancouver)
    - cron: "17 11 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-fetch every professor back to 2024 (slow)"
        type: boolean
        default: false

concurrency:
  group: rmp-reviews
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/rmp/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/rmp/requirements.txt

      - name: Scrape and rebuild review data
        env:
          RMP_FULL: ${{ inputs.full && '1' || '0' }}
          RMP_WORKDIR: ${{ runner.temp }}/rmp
        run: scripts/rmp/run.sh

      - name: Commit updated data
        id: commit
        run: |
          git add -A internal/store/json
          if git diff --cached --quiet; then
            echo "No review changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Record when review data last changed (served as lastReviewUpdate on /health)
          printf '{\n  "lastUpdated": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > internal/store/json/reviews_meta.json
          git add internal/store/json/reviews_meta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898289+github-actions[bot]@users.noreply.github.com"
          files=$(git diff --cached --name-only | wc -l)
          git commit -q -m "Refresh RMP review data ($(date -u +%Y-%m-%d))"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Committed $files changed files." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rmp-logs
          path: |
            ${{ runner.temp }}/rmp/*.log
            ${{ runner.temp }}/rmp/scraped_general/
          if-no-files-found: ignore
